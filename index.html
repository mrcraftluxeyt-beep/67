<!-- index.html - WebApp для Telegram -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuroCAS - Магазин подарков</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 32px;
            background: linear-gradient(45deg, #ffd700, #ffa500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #8892b0;
            font-size: 14px;
        }
        
        .balance-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .balance-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .balance-label {
            font-size: 14px;
            color: #8892b0;
        }
        
        .balance-value {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
        }
        
        .shop-grid {
            display: grid;
            gap: 15px;
        }
        
        .shop-item {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .shop-item:hover {
            transform: translateY(-2px);
            border-color: #ffd700;
            box-shadow: 0 5px 20px rgba(255,215,0,0.2);
        }
        
        .shop-item:active {
            transform: scale(0.98);
        }
        
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .item-name {
            font-size: 18px;
            font-weight: bold;
        }
        
        .item-price {
            background: rgba(255,215,0,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            color: #ffd700;
            font-weight: bold;
        }
        
        .item-desc {
            color: #8892b0;
            font-size: 14px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .modal h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ffd700;
        }
        
        .modal-text {
            text-align: center;
            margin-bottom: 20px;
            color: #8892b0;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.3s;
        }
        
        .btn-pay {
            background: linear-gradient(45deg, #ffd700, #ffa500);
            color: #1a1a2e;
        }
        
        .btn-confirm {
            background: linear-gradient(45deg, #00c853, #69f0ae);
            color: #1a1a2e;
        }
        
        .btn-cancel {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #00c853;
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: bold;
            display: none;
            z-index: 2000;
            animation: slideDown 0.3s ease-out;
        }
        
        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }
        
        .sparkle {
            position: fixed;
            pointer-events: none;
            animation: sparkle 1s ease-out forwards;
        }
        
        @keyframes sparkle {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(0) rotate(180deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌟 AuroCAS</h1>
            <p>Магазин подарков Telegram</p>
        </div>
        
        <div class="balance-card">
            <div class="balance-row">
                <div>
                    <div class="balance-label">Куплено товаров</div>
                    <div class="balance-value" id="totalBought">0</div>
                </div>
                <div style="font-size: 40px;">🛍️</div>
            </div>
        </div>
        
        <div class="shop-grid" id="shopGrid"></div>
    </div>
    
    <!-- Модальное окно покупки -->
    <div class="modal" id="buyModal">
        <div class="modal-content">
            <h2 id="modalTitle"></h2>
            <p class="modal-text" id="modalPrice"></p>
            <p class="modal-text" style="font-size: 12px; margin-top: -15px;">
                ⚠️ Оплата звёздами на @MrCraftLuxeTT
            </p>
            <button class="btn btn-pay" onclick="openPayment()">
                💳 ОПЛАТИТЬ ⭐
            </button>
            <button class="btn btn-confirm" onclick="confirmPayment()">
                ✅ Я ОПЛАТИЛ
            </button>
            <button class="btn btn-cancel" onclick="closeModal()">
                ❌ ОТМЕНА
            </button>
        </div>
    </div>
    
    <!-- Уведомление -->
    <div class="notification" id="notification"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#1a1a2e');
        tg.setBackgroundColor('#1a1a2e');
        
        // Данные магазина
        const SHOP = {
            "star_10": {name: "⭐ 10 звёзд", price: 20, icon: "⭐"},
            "star_50": {name: "⭐ 50 звёзд", price: 80, icon: "💫"},
            "star_100": {name: "⭐ 100 звёзд", price: 140, icon: "🌟"},
            "star_500": {name: "⭐ 500 звёзд", price: 600, icon: "💎"},
            "star_1000": {name: "⭐ 1000 звёзд", price: 1100, icon: "👑"},
            "premium_1": {name: "👑 Premium 1 мес", price: 300, icon: "👑"},
            "premium_3": {name: "👑 Premium 3 мес", price: 800, icon: "💎"},
            "premium_12": {name: "👑 Premium 1 год", price: 2800, icon: "🌀"},
            "sticker_pack": {name: "💎 Стикерпак", price: 250, icon: "🎨"},
            "vip_pack": {name: "🌀 VIP Набор", price: 5000, icon: "🔥"}
        };
        
        let currentItem = null;
        let totalBought = 0;
        
        // Загрузка магазина
        function loadShop() {
            const grid = document.getElementById('shopGrid');
            grid.innerHTML = '';
            
            Object.entries(SHOP).forEach(([id, item]) => {
                const div = document.createElement('div');
                div.className = 'shop-item';
                div.onclick = () => openBuyModal(id, item);
                div.innerHTML = `
                    <div class="item-header">
                        <span class="item-name">${item.icon} ${item.name}</span>
                        <span class="item-price">⭐ ${item.price}</span>
                    </div>
                    <div class="item-desc">Нажмите для покупки</div>
                `;
                grid.appendChild(div);
            });
        }
        
        function openBuyModal(id, item) {
            currentItem = {id, ...item};
            document.getElementById('modalTitle').textContent = item.name;
            document.getElementById('modalPrice').textContent = 
                `Цена: ⭐ ${item.price} звёзд`;
            document.getElementById('buyModal').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('buyModal').classList.remove('active');
            currentItem = null;
        }
        
        function openPayment() {
            if (!currentItem) return;
            
            // Открываем чат с админом для оплаты
            tg.openTelegramLink('https://t.me/MrCraftLuxeTT');
            
            // Показываем подсказку
            showNotification('💡 Отправьте звёзды и нажмите "Я ОПЛАТИЛ"');
        }
        
        function confirmPayment() {
            if (!currentItem) return;
            
            // Отправляем данные в бота
            tg.sendData(JSON.stringify({
                action: 'buy',
                item: currentItem.id,
                price: currentItem.price,
                name: currentItem.name
            }));
            
            // Эффект конфетти
            createSparkles();
            
            // Увеличиваем счётчик
            totalBought++;
            document.getElementById('totalBought').textContent = totalBought;
            
            showNotification('✅ Заявка отправлена! Ждите подарок 🎁');
            closeModal();
        }
        
        function showNotification(text) {
            const notif = document.getElementById('notification');
            notif.textContent = text;
            notif.style.display = 'block';
            
            setTimeout(() => {
                notif.style.display = 'none';
            }, 3000);
        }
        
        function createSparkles() {
            for (let i = 0; i < 20; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.innerHTML = ['✨', '⭐', '💫', '🌟', '🎉'][Math.floor(Math.random() * 5)];
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';
                sparkle.style.fontSize = (Math.random() * 30 + 10) + 'px';
                sparkle.style.animationDuration = (Math.random() * 1 + 0.5) + 's';
                document.body.appendChild(sparkle);
                
                setTimeout(() => sparkle.remove(), 1000);
            }
        }
        
        // Обработка данных от бота
        tg.onEvent('mainButtonClicked', () => {
            tg.sendData(JSON.stringify({action: 'close'}));
        });
        
        // Загрузка
        loadShop();
        
        // Настройка главной кнопки
        tg.MainButton.setText('🛍 ОТКРЫТЬ МАГАЗИН').show();
    </script>
</body>
    </html>
